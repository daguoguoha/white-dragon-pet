<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex娘 · 原生素材预览</title>
<style>body{font:16px system-ui;background:#f4effb;color:#51445d;margin:28px;max-width:800px}h1{font-size:23px}select,button{font:inherit;padding:8px;margin:4px;border:1px solid #d9cbe7;border-radius:8px;background:white;color:inherit}.stage{height:350px;background:white;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:20px 0}.sprite{width:192px;height:208px;background-repeat:no-repeat;background-size:1536px 2288px;transform:scale(1.45)}p{line-height:1.65;color:#80718e}</style>
<h1>Codex娘 · 原生素材槽位预览</h1><p>这里只预览 Codex 固定槽位中的图片；实际触发由 Codex 控制。换食物需运行对应 CMD，更换同一个宠物条目的素材。</p>
<select id="food"><option value="fish">小鱼干</option><option value="cake">蛋糕</option><option value="lollipop">棒棒糖</option><option value="dango">团子</option><option value="diamond">钻石</option></select>
<select id="state"><option value="7">工作中 → 进食</option><option value="3">互动槽 → 摸头反应</option><option value="6">等待确认 → 闭眼休息</option><option value="5">失败 → 生气</option><option value="0">眨眼待机</option><option value="1">向右移动</option><option value="2">向左移动</option><option value="4">跳跃庆祝</option><option value="8">读书检查</option><option value="9">十六向视线</option><option value="11">v2 中性姿态</option></select>
<button id="pause">暂停 / 播放</button><div class="stage"><div class="sprite" id="sprite"></div></div>
<p>闭眼画面不代表新增了睡眠计时器，摸头反应画面不代表新增了触摸检测。此版本不修改 Codex 客户端。</p>
<script>const timing=[[280,110,110,140,140,320],[120,120,120,120,120,120,120,220],[120,120,120,120,120,120,120,220],[140,140,140,280],[140,140,140,140,280],[140,140,140,140,140,140,140,240],[150,150,150,150,150,260],[120,120,120,120,120,220],[150,150,150,150,150,280]];let frame=0,paused=false,timer;const food=document.getElementById('food'),state=document.getElementById('state'),sprite=document.getElementById('sprite');function render(){clearTimeout(timer);const s=Number(state.value);let row=s,column=frame,delay=180;if(s===9){row=9+Math.floor(frame/8);column=frame%8;delay=220}else if(s===11){row=0;column=6;delay=800}else{frame%=timing[s].length;column=frame;delay=timing[s][frame]}sprite.style.backgroundImage='url("packages/'+food.value+'/spritesheet.png")';sprite.style.backgroundPosition=(-column*192)+'px '+(-row*208)+'px';timer=setTimeout(()=>{if(!paused)frame=s===9?(frame+1)%16:s===11?0:(frame+1)%timing[s].length;render()},delay)}food.onchange=state.onchange=()=>{frame=0;render()};document.getElementById('pause').onclick=()=>paused=!paused;render();</script>
